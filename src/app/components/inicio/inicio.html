<div class="CartaInicio">
    <div class="CartaInicio__imagen">
        <img src="/Img/NiñoArbol.jpg" alt="Niño sentado" />
    </div>

    <div class="CartaInicio__contenido">
        <p>Bienvenido a la casa, lector.
            Tu próxima historia te espera aqui.
        </p>
        <button type="button" class="CartaInicio__boton">Explorar novedades</button>
    </div>
</div>

<div class="div separador">
<p></p>
</div>

<div class="CartaUltimosLibros">
    <h2>Lo Último en la comunidad</h2>
    
    <div class="LibrosDestacados">
    @for(libro of LibrosDestacados(); track libro.id){
        <div class="marcoDestacado">
            <div>
                <img [src]="libro.imagen">
                <h3>{{libro.titulo}}</h3>
                <p>Autor: {{libro.autor}}</p>
                <button class="button1">detalles</button>
            </div>
        </div>
    }
    </div>
</div>
